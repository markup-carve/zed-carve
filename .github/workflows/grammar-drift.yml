name: Grammar drift

# The grammar is a PINNED revision of another repository, so this extension can
# fall behind without a commit here. CI proves the pin still BUILDS and that the
# queries and fixtures still match it - none of which can notice that upstream
# moved, because everything it checks moves with the pin.
#
# The pin sat 32 commits behind while every job stayed green. Those commits
# carried nine grammar fixes, and 103 of the 610 shared-corpus documents parsed
# differently between the two revisions - including five the pinned grammar
# could not parse without an ERROR node at all.
#
# Upstream moving is work, not a failure of this repo (carve#2706), so a pin
# behind main opens or updates one re-vendor pull request and the run stays
# green. BUMP_TOKEN is a fine-grained PAT rather than the default token,
# because a pull request the default token opens does not trigger CI.
#
# The run goes red only when the check itself cannot do its job: an invalid
# pin, a missing BUMP_TOKEN, or a failed push. A red SCHEDULED run reaches
# nobody, so that case files one tracking issue, reused across runs.

on:
  schedule:
    - cron: "45 6 * * *"
  workflow_dispatch:
    inputs:
      rev:
        description: "Check this grammar revision instead of the extension.toml pin"
        required: false
        default: ""

permissions:
  contents: read
  # Needed only by the step that reports a red run as an issue.
  issues: write

concurrency:
  group: grammar-drift
  cancel-in-progress: false

# Every job declares timeout-minutes. Without one GitHub applies a 360-minute
# default, roughly 900x the median job in this org, so a hung step burns hours
# of runner time before anything stops it.
jobs:
  grammar-pin:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check out the grammar
        uses: actions/checkout@v7
        with:
          repository: markup-carve/tree-sitter-carve
          path: tree-sitter-carve
          fetch-depth: 0

      - name: Compare the pinned revision against tree-sitter-carve main
        id: compare
        env:
          REV_OVERRIDE: ${{ inputs.rev }}
        run: |
          set -euo pipefail
          rev="${REV_OVERRIDE:-}"
          [ -n "${rev}" ] || rev="$(sed -n '/^\[grammars\.carve\]/,/^\[/p' extension.toml \
                 | grep -oE 'rev *= *"[0-9a-f]{40}"' | grep -oE '[0-9a-f]{40}' | head -1)"
          fail() {
            printf '%s\n' "$1" > "${RUNNER_TEMP}/drift-reason.txt"
            echo "::error::$1"
            exit 1
          }
          if [ -z "${rev}" ]; then
            fail "extension.toml: [grammars.carve] has no 40-hex rev"
          fi
          if ! git -C tree-sitter-carve cat-file -e "${rev}^{commit}" 2>/dev/null; then
            fail "the grammar pins ${rev}, which is not a commit in markup-carve/tree-sitter-carve"
          fi
          if ! git -C tree-sitter-carve merge-base --is-ancestor "${rev}" origin/main; then
            fail "grammar ${rev} is not on main, so the pin came from an unmerged or rewritten branch"
          fi
          behind="$(git -C tree-sitter-carve rev-list --count "${rev}..origin/main")"
          echo "grammar pin: ${rev} ($(git -C tree-sitter-carve log -1 --format=%s "${rev}"))"
          echo "tree-sitter-carve main is ${behind} commit(s) ahead"
          {
            echo "rev=${rev}"
            echo "behind=${behind}"
            echo "head=$(git -C tree-sitter-carve rev-parse origin/main)"
          } >> "$GITHUB_OUTPUT"

      - name: Open or update the re-vendor pull request
        id: revendor
        if: steps.compare.outputs.behind != '0' && inputs.rev == '' && github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ secrets.BUMP_TOKEN }}
          REPO: ${{ github.repository }}
          OLD: ${{ steps.compare.outputs.rev }}
          NEW: ${{ steps.compare.outputs.head }}
          BEHIND: ${{ steps.compare.outputs.behind }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            msg="BUMP_TOKEN is not set, so the drift job cannot open the re-vendor pull request"
            printf '%s\n' "${msg}" > "${RUNNER_TEMP}/drift-reason.txt"
            echo "::error::${msg}"
            exit 1
          fi
          branch=automation/revendor-grammar
          short="${NEW:0:7}"
          remote="https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"

          # An OPEN pull request already carrying this revision needs nothing;
          # pushing again would only restart its CI. A branch without an open
          # pull request (closed, or a create that failed) is pushed again.
          pr="$(gh pr list --repo "${REPO}" --head "${branch}" --state open --json number --jq '.[0].number // empty')"
          if [ -n "${pr}" ]; then
            git fetch -q "${remote}" "${branch}"
            if git show FETCH_HEAD:extension.toml | grep -q "${NEW}"; then
              echo "#${pr} already pins ${NEW}; nothing to do."
              exit 0
            fi
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -B "${branch}"
          sed -i "s/${OLD}/${NEW}/g" extension.toml
          git commit -q -am "chore: move the grammar pin to tree-sitter-carve ${short}"
          git push -q --force "${remote}" "${branch}"

          {
            echo "Moves the \`extension.toml\` grammar pin from \`${OLD:0:7}\` to tree-sitter-carve main \`${short}\`, ${BEHIND} commit(s) ahead."
            echo
            echo "Opened by the scheduled grammar-drift job. CI builds the new revision and checks the queries and fixtures against it; a red run here means they name something the grammar changed."
            echo
            echo "Upstream commits in this move:"
            echo
            echo '```text'
            git -C tree-sitter-carve log --format='%h %s' "${OLD}..${NEW}"
            echo '```'
          } > "${RUNNER_TEMP}/body.md"

          pr="$(gh pr list --repo "${REPO}" --head "${branch}" --state open --json number --jq '.[0].number // empty')"
          title="chore: move the grammar pin to tree-sitter-carve ${short}"
          if [ -n "${pr}" ]; then
            gh pr edit "${pr}" --repo "${REPO}" --title "${title}" --body-file "${RUNNER_TEMP}/body.md"
            echo "Updated #${pr}."
          else
            gh pr create --repo "${REPO}" --base "${BASE}" --head "${branch}" \
              --title "${title}" --body-file "${RUNNER_TEMP}/body.md" \
              --label chore --label area:grammar --label area:editor
          fi

      # A schedule failure reaches nobody, so carry it into the backlog, which
      # is read. One issue is reused across runs: a daily new issue would be
      # noise, and noise is how the last red week stayed unread.

      # main requires its checks and an up-to-date branch, so auto-merge waits for
      # this repo's CI. GitHub never updates a BEHIND branch itself, so do it here.
      # Enabling auto-merge is a CONVENIENCE on a pull request that already
      # exists. The deliverable of a behind pin is the open re-vendor pull
      # request, and the step is idempotent, so the next scheduled run picks up
      # whatever this one could not finish. A GitHub-side API error here
      # therefore warns; it does not fail the job. Run 37788950783 failed on a
      # transient `GraphQL: Something went wrong while executing your query`
      # after the pin had been compared and the pull request opened, and the
      # red run then filed an issue saying the check could not compare the pin.
      - name: Merge the re-vendor pull request once its checks pass
        if: steps.revendor.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.BUMP_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: automation/revendor-grammar
        run: |
          set -uo pipefail
          # Retries a transient API error; a real refusal still loses after the
          # last attempt, and the caller decides what that means.
          retry() {
            attempt=1
            while :; do
              if "$@"; then
                return 0
              fi
              if [ "${attempt}" -ge 4 ]; then
                return 1
              fi
              echo "attempt ${attempt} of 4 failed: $*" >&2
              attempt=$((attempt + 1))
              sleep $((attempt * 5))
            done
          }
          give_up() {
            echo "::warning::${1}. The re-vendor pull request stays open and the next scheduled run retries."
            exit 0
          }

          pr="$(retry gh pr list --repo "${REPO}" --head "${BRANCH}" --state open --json number --jq '.[0].number // empty')" \
            || give_up "could not list the re-vendor pull request"
          if [ -z "${pr}" ]; then
            echo "No open re-vendor pull request."
            exit 0
          fi
          state=UNKNOWN
          for _ in 1 2 3 4 5; do
            state="$(retry gh pr view "${pr}" --repo "${REPO}" --json mergeStateStatus --jq .mergeStateStatus)" \
              || give_up "could not read the merge state of #${pr}"
            [ "${state}" = UNKNOWN ] || break
            sleep 5
          done
          if [ "${state}" = BEHIND ]; then
            retry gh api "repos/${REPO}/pulls/${pr}/update-branch" -X PUT --silent \
              || give_up "could not update #${pr} onto the default branch"
            echo "Updated #${pr} onto the default branch."
          fi
          retry gh pr merge "${pr}" --repo "${REPO}" --squash --auto \
            || give_up "could not enable auto-merge on #${pr}"
          echo "Auto-merge (squash) enabled on #${pr}."
      - name: Report a red run as an issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: "Grammar drift check is failing"
          COMPARE: ${{ steps.compare.outcome }}
          REVENDOR: ${{ steps.revendor.outcome }}
        run: |
          set -euo pipefail
          # Only the compare and re-vendor steps write a reason, so a failure
          # anywhere else used to be reported as "failed before it could
          # compare the pin" - which named the wrong stage and, in run
          # 37788950783, was simply false: the pin had been compared and the
          # output was in the log. Name the stage from the step outcomes.
          reason="$(cat "${RUNNER_TEMP}/drift-reason.txt" 2>/dev/null || true)"
          if [ -z "${reason}" ]; then
            if [ "${COMPARE}" != success ]; then
              reason="the Grammar drift run failed while comparing the pin"
            elif [ "${REVENDOR}" = failure ]; then
              reason="the pin was compared, but the re-vendor pull request could not be opened or updated"
            else
              reason="the pin was compared and the re-vendor step did not fail, so the run failed in a later step - read the run log"
            fi
          fi
          {
            printf '%s\n\n' "${reason}"
            printf 'Run: %s\n\n' "${RUN_URL}"
            printf 'A pin behind main does not fail this job; it opens a re-vendor pull request.\n'
            printf 'Enabling auto-merge on that pull request does not fail it either - that warns.\n'
            printf 'So a red run here means a step could not do its job. The reason above names which.\n'
          } > "${RUNNER_TEMP}/body.md"
          existing="$(gh issue list --repo "${REPO}" --state open --search "${TITLE} in:title" \
                        --json number,title --jq "map(select(.title == \"${TITLE}\")) | .[0].number // empty")"
          if [ -n "${existing}" ]; then
            gh issue comment "${existing}" --repo "${REPO}" --body-file "${RUNNER_TEMP}/body.md"
          else
            gh issue create --repo "${REPO}" --title "${TITLE}" --body-file "${RUNNER_TEMP}/body.md" \
              --label chore --label area:grammar --label area:editor
          fi
