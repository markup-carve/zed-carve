id = "carve"
name = "Carve"
description = "Syntax highlighting for Carve, a post-Djot lightweight markup language"
version = "0.1.0"
schema_version = 1
authors = ["Mark Scherer <dereuromark@gmail.com>"]
repository = "https://github.com/markup-carve/zed-carve"
themes = []
icon_themes = []
languages = ["languages/carve"]
capabilities = []

[grammars.djot]
# php-collective fork of treeman/tree-sitter-djot. Carries a WASM-host
# compat fix (isalnum -> inline ASCII helper) so Zed loads the grammar
# cleanly. Carve does not yet have a native tree-sitter grammar, so this
# extension uses the closest available post-Djot parser as a compatibility
# layer and layers Carve-oriented queries/config on top.
repository = "https://github.com/php-collective/tree-sitter-djot"
