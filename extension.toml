id = "carve"
name = "Carve"
description = "Syntax highlighting for Carve, a lightweight markup language for documents and the web"
version = "0.1.9"
schema_version = 1
authors = ["Mark Scherer <dereuromark@users.noreply.github.com>"]
repository = "https://github.com/markup-carve/zed-carve"
themes = []
icon_themes = []
languages = ["languages/carve"]
snippets = ["./snippets/carve.json"]
capabilities = []

[grammars.carve]
repository = "https://github.com/markup-carve/tree-sitter-carve"
